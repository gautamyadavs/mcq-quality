[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcq-quality"
version = "0.1.0"
description = "Integrated codebase demonstrating Skills, MCP, and multi-step agent workflows for MCQ quality (19 item-writing flaw checks)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gautamyadavs" }]
keywords = [
    "mcp",
    "mcq",
    "agent-skill",
    "agents",
    "education",
    "edtech",
    "applied-ai-in-learning-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# Pick one of these (or all) when installing, depending on which LLM you want
# the workflow's LLM-driven agents (Drafter, Reviewer, Reviser) to use.
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
all = ["anthropic>=0.40.0", "openai>=1.50.0"]
dev = ["pytest>=7.0"]

[project.scripts]
# Convenience entry points; the same code is reachable via `python -m mcq_quality.<subpackage>`.
mcq-quality-server = "mcq_quality.server.__main__:main"
mcq-quality-workflow = "mcq_quality.workflow.compare_pipelines:main"

[tool.setuptools.packages.find]
include = ["mcq_quality*"]
exclude = ["skill*", "examples*", "tests*"]

[tool.setuptools.package-data]
"mcq_quality.core" = ["references/*.md", "*.json"]
